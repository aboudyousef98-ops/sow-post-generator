# Netlify build config for the SOW Post Generator (Vite SPA + Functions).
#
# Environment variables are set in the Netlify UI (Site settings -> Environment
# variables) — NEVER committed here. Required:
#   OPENAI_API_KEY, ALLOWED_ORIGINS, API_PATH_TOKEN, VITE_API_PATH_TOKEN
# Optional (have defaults): OPENAI_MODEL_VISION, OPENAI_MODEL_TEXT
#
# Access control (07-netlify-functions.md): no login. Every function checks
# Origin/Referer against ALLOWED_ORIGINS and validates the :token path segment
# against API_PATH_TOKEN. netlify.toml cannot read env vars in redirects, so
# the token is validated inside the functions, not here.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Tokenized API paths -> function files. :token is validated server-side.
[[redirects]]
  from = "/api/:token/extract"
  to = "/.netlify/functions/extract"
  status = 200

[[redirects]]
  from = "/api/:token/rewrite"
  to = "/.netlify/functions/rewrite"
  status = 200

[[redirects]]
  from = "/api/:token/region"
  to = "/.netlify/functions/region"
  status = 200

[[redirects]]
  from = "/api/:token/notecheck"
  to = "/.netlify/functions/notecheck"
  status = 200

[[redirects]]
  from = "/api/:token/updatesearch"
  to = "/.netlify/functions/updatesearch"
  status = 200

# Added 2026-11-05. Without this the path falls through to the SPA fallback
# below and answers 200 with index.html, which the client would read as a
# malformed AI response rather than a missing route.
[[redirects]]
  from = "/api/:token/activityquery"
  to = "/.netlify/functions/activityquery"
  status = 200

[[redirects]]
  from = "/api/:token/records"
  to = "/.netlify/functions/records"
  status = 200

[[redirects]]
  from = "/api/:token/ahjs"
  to = "/.netlify/functions/ahjs"
  status = 200

[[redirects]]
  from = "/api/:token/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/:token/users"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/api/:token/board"
  to = "/.netlify/functions/board"
  status = 200

[[redirects]]
  from = "/api/:token/extrawork"
  to = "/.netlify/functions/extrawork"
  status = 200

# Bot API (Aboud 2026-11-23) — the BEARER lane. A splat, because the router
# inside bot.mts handles /api/bot/v1/<anything>. The :token rules above never
# match these (they are 4+ segments), so order is not load-bearing.
[[redirects]]
  from = "/api/bot/*"
  to = "/.netlify/functions/bot"
  status = 200

# API-token management + webhook config, both browser-facing (Origin+token).
[[redirects]]
  from = "/api/:token/tokens"
  to = "/.netlify/functions/tokens"
  status = 200

[[redirects]]
  from = "/api/:token/botconfig"
  to = "/.netlify/functions/botconfig"
  status = 200

# Public API docs page (no token values).
[[redirects]]
  from = "/api/docs"
  to = "/.netlify/functions/botdocs"
  status = 200

# SPA fallback — must stay last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
